<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шаров Сергей — Директор ИТ</title>
<meta name="description" content="Резюме Шарова Сергея Станиславовича — Директор ИТ / Руководитель Управления Информационных Систем. 26+ лет опыта, цифровизация бизнеса, 1С, ERP.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #12141a;          /* основной фон — глубокий графит */
    --bg-soft: #1a1d26;      /* фон карточек */
    --bg-softer: #22262f;    /* фон блоков внутри карточек */
    --text: #e8eaed;         /* основной текст */
    --text-dim: #9ba0a8;     /* приглушённый текст */
    --accent: #c9a961;       /* золото — акцент */
    --accent-soft: #d9bc7e;  /* светлое золото */
    --border: #2a2e38;       /* границы */
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Segoe UI', -apple-system, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.65;
    font-size: 16px;
  }

  /* ============= НАВИГАЦИЯ ============= */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(18, 20, 26, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 14px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
  }
  .topnav .brand {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    color: var(--accent);
  }
  .topnav nav a {
    color: var(--text-dim);
    text-decoration: none;
    margin-left: 22px;
    font-size: 14px;
    transition: color 0.2s;
  }
  .topnav nav a:hover { color: var(--accent); }

  /* ============= КОНТЕЙНЕР ============= */
  .container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ============= ШАПКА РЕЗЮМЕ ============= */
  .hero {
    padding: 60px 0 40px;
    display: grid;
    grid-template-columns: 180px 1fr;
    gap: 40px;
    align-items: start;
  }
  .hero .photo {
    width: 180px;
    height: 180px;
    border-radius: 12px;
    object-fit: cover;
    border: 2px solid var(--accent);
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
  }
  .hero .photo-placeholder {
    width: 180px;
    height: 180px;
    border-radius: 12px;
    background: var(--bg-soft);
    border: 2px dashed var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    font-size: 13px;
    text-align: center;
    padding: 10px;
  }
  .hero h1 {
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
  }
  .hero .position {
    color: var(--accent);
    font-size: 17px;
    font-weight: 500;
    margin-bottom: 20px;
    letter-spacing: 0.3px;
  }
  .hero .contacts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 8px 24px;
    font-size: 14px;
    color: var(--text-dim);
  }
  .hero .contacts div { display: flex; align-items: center; gap: 8px; }
  .hero .contacts .ico { color: var(--accent); width: 18px; display: inline-block; }
  .hero .contacts a { color: var(--text); text-decoration: none; }
  .hero .contacts a:hover { color: var(--accent); }

  /* Кнопка скачать PDF */
  .btn-pdf {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
    padding: 12px 22px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    text-decoration: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s;
  }
  .btn-pdf:hover {
    background: var(--accent);
    color: var(--bg);
  }

  /* ============= СЕКЦИИ ============= */
  section {
    padding: 40px 0;
    border-top: 1px solid var(--border);
  }
  .section-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* О себе */
  .about-text {
    font-size: 16px;
    color: var(--text);
    line-height: 1.75;
  }
  .about-text p { margin-bottom: 12px; }

  /* Опыт работы */
  .job {
    background: var(--bg-soft);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 18px;
    border-left: 3px solid transparent;
    transition: border-color 0.2s;
  }
  .job:hover { border-left-color: var(--accent); }

  .job-header {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 6px;
  }
  .job-company { font-size: 18px; font-weight: 600; color: var(--text); }
  .job-period {
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
    background: var(--bg-softer);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .job-position {
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 14px;
    font-size: 15px;
  }
  .job-industry {
    color: var(--text-dim);
    font-size: 13px;
    margin-bottom: 14px;
    font-style: italic;
  }
  .job ul {
    list-style: none;
    padding: 0;
  }
  .job ul li {
    position: relative;
    padding-left: 20px;
    margin-bottom: 9px;
    color: var(--text);
    font-size: 15px;
    line-height: 1.6;
  }
  .job ul li::before {
    content: '▪';
    position: absolute;
    left: 0;
    color: var(--accent);
    font-size: 14px;
  }

  /* Образование */
  .edu {
    background: var(--bg-soft);
    border-radius: 12px;
    padding: 22px 26px;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .edu-year {
    color: var(--accent);
    font-weight: 600;
    font-size: 14px;
    min-width: 60px;
  }
  .edu-info .title { font-weight: 600; margin-bottom: 4px; }
  .edu-info .desc { color: var(--text-dim); font-size: 14px; }

  /* Навыки */
  .skills-group { margin-bottom: 22px; }
  .skills-group h4 {
    color: var(--text-dim);
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 10px;
    font-weight: 600;
  }
  .skills-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .skills-tags span {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    color: var(--text);
    transition: all 0.2s;
  }
  .skills-tags span:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Языки */
  .langs { display: flex; flex-wrap: wrap; gap: 12px; }
  .lang {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 15px;
  }
  .lang b { color: var(--accent); }

  /* Доп. инфо */
  .extras {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .extra-item {
    background: var(--bg-soft);
    padding: 16px 20px;
    border-radius: 10px;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .extra-item .ico { color: var(--accent); font-size: 20px; }

  /* ============= ПОДВАЛ ============= */
  footer {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-dim);
    font-size: 13px;
    border-top: 1px solid var(--border);
    margin-top: 30px;
  }
  footer a { color: var(--text-dim); text-decoration: none; }
  footer a:hover { color: var(--accent); }

  /* ============= АДАПТИВ ============= */
  @media (max-width: 640px) {
    .hero {
      grid-template-columns: 1fr;
      text-align: center;
      padding: 40px 0 30px;
      gap: 24px;
    }
    .hero .photo, .hero .photo-placeholder { margin: 0 auto; width: 140px; height: 140px; }
    .hero h1 { font-size: 26px; }
    .hero .contacts { text-align: left; }
    .job { padding: 20px; }
    .topnav { padding: 12px 16px; }
    .topnav nav a { margin-left: 12px; font-size: 13px; }
  }
</style>
</head>
<body>

<!-- ============ НАВИГАЦИЯ ============ -->
<div class="topnav">
  <div class="brand" id="navBrand">—</div>
  <nav>
    <a href="#about">О себе</a>
    <a href="#experience">Опыт</a>
    <a href="#education">Образование</a>
    <a href="#skills">Навыки</a>
    <a href="#extras">Дополнительно</a>
  </nav>
</div>

<main class="container">

  <!-- ============ ШАПКА ============ -->
  <header class="hero">
    <div id="photoContainer"></div>
    <div>
      <h1 id="fullName">—</h1>
      <div class="position" id="position">—</div>
      <div class="contacts" id="contacts"></div>
      <a class="btn-pdf" id="pdfButton" href="#" download>
        ⬇ Скачать резюме (PDF)
      </a>
    </div>
  </header>

  <!-- ============ О СЕБЕ ============ -->
  <section id="about">
    <h2 class="section-title">О себе</h2>
    <div class="about-text" id="aboutText"></div>
  </section>

  <!-- ============ ОПЫТ РАБОТЫ ============ -->
  <section id="experience">
    <h2 class="section-title">Опыт работы</h2>
    <div id="jobsList"></div>
  </section>

  <!-- ============ ОБРАЗОВАНИЕ ============ -->
  <section id="education">
    <h2 class="section-title">Образование</h2>
    <div id="educationList"></div>
  </section>

  <!-- ============ НАВЫКИ ============ -->
  <section id="skills">
    <h2 class="section-title">Ключевые навыки</h2>
    <div id="skillsList"></div>
  </section>

  <!-- ============ ДОПОЛНИТЕЛЬНО ============ -->
  <section id="extras">
    <h2 class="section-title">Дополнительно</h2>
    <div class="extras" id="extrasList"></div>
    <div style="margin-top:24px;">
      <h4 style="color:var(--text-dim);font-size:13px;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:10px;">Языки</h4>
      <div class="langs" id="langsList"></div>
    </div>
  </section>

</main>

<footer>
  © <span id="year"></span> <span id="footerName">—</span> ·
  Резюме обновлено <span id="updatedAt">—</span>
</footer>

<!-- ============ ДАННЫЕ РЕЗЮМЕ ============ -->
<script src="data.js"></script>

<!-- ============ ЛОГИКА ОТРИСОВКИ ============ -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    const d = RESUME;

    // Навигация и футер
    document.getElementById('navBrand').textContent = d.name.short;
    document.getElementById('footerName').textContent = d.name.full;
    document.getElementById('year').textContent = new Date().getFullYear();
    document.getElementById('updatedAt').textContent = d.meta.updatedAt;

    // ФИО и должность
    document.getElementById('fullName').textContent = d.name.full;
    document.getElementById('position').textContent = d.position;

    // Фото
    const photoBox = document.getElementById('photoContainer');
    if (d.photo && d.photo.length > 0) {
      const img = document.createElement('img');
      img.className = 'photo';
      img.src = d.photo;
      img.alt = d.name.full;
      photoBox.appendChild(img);
    } else {
      const ph = document.createElement('div');
      ph.className = 'photo-placeholder';
      ph.textContent = 'Фото\n(добавьте photo.jpg)';
      ph.style.whiteSpace = 'pre-line';
      photoBox.appendChild(ph);
    }

    // Контакты
    const contactsBox = document.getElementById('contacts');
    d.contacts.forEach(function (c) {
      const div = document.createElement('div');
      const ico = document.createElement('span');
      ico.className = 'ico';
      ico.textContent = c.icon;
      div.appendChild(ico);
      if (c.link) {
        const a = document.createElement('a');
        a.href = c.link;
        a.textContent = c.value;
        div.appendChild(a);
      } else {
        const span = document.createElement('span');
        span.textContent = c.value;
        div.appendChild(span);
      }
      contactsBox.appendChild(div);
    });

    // Кнопка PDF
    document.getElementById('pdfButton').href = d.pdfFile;

    // О себе
    const aboutBox = document.getElementById('aboutText');
    d.about.forEach(function (p) {
      const el = document.createElement('p');
      el.textContent = p;
      aboutBox.appendChild(el);
    });

    // Опыт работы
    const jobsBox = document.getElementById('jobsList');
    d.jobs.forEach(function (j) {
      const card = document.createElement('div');
      card.className = 'job';

      const header = document.createElement('div');
      header.className = 'job-header';
      header.innerHTML = '<div class="job-company">' + j.company + '</div>' +
                         '<div class="job-period">' + j.period + '</div>';
      card.appendChild(header);

      const pos = document.createElement('div');
      pos.className = 'job-position';
      pos.textContent = j.position;
      card.appendChild(pos);

      if (j.industry) {
        const ind = document.createElement('div');
        ind.className = 'job-industry';
        ind.textContent = j.industry;
        card.appendChild(ind);
      }

      const ul = document.createElement('ul');
      j.duties.forEach(function (duty) {
        const li = document.createElement('li');
        li.textContent = duty;
        ul.appendChild(li);
      });
      card.appendChild(ul);

      jobsBox.appendChild(card);
    });

    // Образование
    const eduBox = document.getElementById('educationList');
    d.education.forEach(function (e) {
      const card = document.createElement('div');
      card.className = 'edu';
      card.innerHTML =
        '<div class="edu-year">' + e.year + '</div>' +
        '<div class="edu-info" style="flex:1;">' +
          '<div class="title">' + e.institution + '</div>' +
          '<div class="desc">' + e.specialty + '</div>' +
        '</div>';
      eduBox.appendChild(card);
    });

    // Навыки
    const skillsBox = document.getElementById('skillsList');
    d.skills.forEach(function (group) {
      const wrap = document.createElement('div');
      wrap.className = 'skills-group';
      const h4 = document.createElement('h4');
      h4.textContent = group.category;
      wrap.appendChild(h4);
      const tags = document.createElement('div');
      tags.className = 'skills-tags';
      group.items.forEach(function (item) {
        const s = document.createElement('span');
        s.textContent = item;
        tags.appendChild(s);
      });
      wrap.appendChild(tags);
      skillsBox.appendChild(wrap);
    });

    // Языки
    const langsBox = document.getElementById('langsList');
    d.languages.forEach(function (l) {
      const el = document.createElement('div');
      el.className = 'lang';
      el.innerHTML = l.name + ' — <b>' + l.level + '</b>';
      langsBox.appendChild(el);
    });

    // Дополнительно
    const extrasBox = document.getElementById('extrasList');
    d.extras.forEach(function (ex) {
      const el = document.createElement('div');
      el.className = 'extra-item';
      el.innerHTML = '<span class="ico">' + ex.icon + '</span><span>' + ex.text + '</span>';
      extrasBox.appendChild(el);
    });
  });
</script>

</body>
</html>
